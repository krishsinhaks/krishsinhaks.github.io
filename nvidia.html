<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NVIDIA, Decoded · Krish Sinha</title><meta name="description" content="An interactive NVIDIA financial analysis by Krish Sinha: statements, ratios, stock and verdict."><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.png" type="image/png" sizes="48x48"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#14233f"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style></head><body><style>
/* Layout: Krish's portfolio language (beige canvas, navy ink, tan accents, stacked rounded sections) applied to a lesson: read → calculate → judge. Single light theme by choice. */
:root{
  --sand:#ece3d3; --paper:#f8f3ea; --card:#fbf8f2; --ink:#14233f; --ink-2:#3d4b68; --muted:#6b7895;
  --navy:#24407a; --tan:#e2cfa9; --line:#d5c8b1;
  --s1:#2f55a4; --s2:#b8862f; --s3:#4f8fd6;
  --good:#2f7d5b; --bad:#b3412e;
  --font:"Poppins",ui-sans-serif,system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html{scroll-behavior:smooth}
html,body{overflow-x:clip}
body{background:var(--sand);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.65;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{margin:0;line-height:1.1;text-wrap:balance}
a{color:var(--navy)}
p{margin:0 0 14px}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--navy);outline-offset:3px}

/* bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:#f4ead6;box-shadow:0 6px 20px rgba(15,27,51,.18)}
.bar-in{max-width:1120px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{justify-self:start;font-weight:800;letter-spacing:-.03em;font-size:19px;text-decoration:none;color:#f4ead6;white-space:nowrap}
.mark small{font-weight:500;font-size:11px;color:var(--tan);margin-left:8px;letter-spacing:.1em}
.idx{display:flex;gap:2px;justify-content:center;min-width:0}
.idx a{text-decoration:none;font-size:13.5px;font-weight:500;padding:7px 12px;border-radius:8px;color:#cfd6e6;white-space:nowrap}
.idx a b{font-weight:600;color:var(--tan);margin-right:6px;font-size:11px}
.idx a:hover{background:#22365e;color:#fff}
.bar .cta{justify-self:end;background:var(--tan);color:var(--ink);font-weight:600;font-size:13.5px;text-decoration:none;padding:8px 14px;border-radius:8px;white-space:nowrap}

/* hero */
.hero{padding-block:56px 96px;position:relative}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(56px,10vw,128px);font-weight:800;letter-spacing:-.05em;line-height:.9;margin:14px 0 18px}
.hero h1 span{color:var(--navy)}
.lede{font-size:19px;color:var(--ink-2);max-width:58ch}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:34px}
.stat{background:var(--paper);border-radius:18px;padding:16px 18px;box-shadow:0 10px 26px rgba(15,27,51,.1);transform:rotate(var(--r,0deg))}
.stat.dark{background:var(--ink);color:#f4ead6}
.stat.tan{background:var(--tan)}
.stat b{display:block;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:12.5px;opacity:.85}
.progress{margin-top:30px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--ink-2)}
.pbar{flex:1 1 220px;max-width:360px;height:10px;border-radius:99px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--navy);border-radius:99px;transition:width .4s}

/* sections */
section{position:relative;border-radius:40px 40px 0 0;margin-top:-40px;box-shadow:0 -16px 36px rgba(15,27,51,.07);padding-block:88px}
.s-paper{background:var(--paper)}.s-sand{background:var(--sand)}.s-ink{background:var(--ink);color:#f4ead6}
.s-ink a{color:var(--tan)}
.big{font-weight:700;color:#7d8aa6;font-size:clamp(42px,7vw,88px);letter-spacing:-.045em;line-height:.92;margin-bottom:14px}
.big em{font-style:normal;color:var(--ink)}
.s-ink .big{color:#a9b4cb}.s-ink .big em{color:var(--tan)}
.sec-lede{font-size:17px;color:var(--ink-2);max-width:62ch;margin-bottom:36px}
.s-ink .sec-lede{color:#cfd6e6}
.lesson-no{display:inline-block;background:var(--ink);color:#f4ead6;font-size:12px;font-weight:600;letter-spacing:.14em;padding:5px 12px;border-radius:99px;margin-bottom:16px}
.s-ink .lesson-no{background:var(--tan);color:var(--ink)}
h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin:40px 0 10px}
h4{font-size:17px;font-weight:600;margin:0 0 6px}

/* explainer cards */
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cols>*{min-width:0}
.card{background:var(--card);border-radius:18px;padding:20px;box-shadow:0 8px 22px rgba(15,27,51,.07)}
.card p{font-size:14.5px;color:var(--ink-2);margin:0}
.card .q{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.note{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;background:#fff;border-radius:14px;padding:14px 16px;margin:16px 0;box-shadow:0 0 0 1px var(--line);font-size:14.5px}
.note .ic{width:32px;height:32px;border-radius:10px;background:var(--tan);display:grid;place-items:center;font-weight:700}
.note.warn .ic{background:#f3d9d2;color:var(--bad)}
.note p{margin:0}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;align-items:stretch;margin:20px 0 6px}
.flow div{background:var(--ink);color:#f4ead6;padding:14px 16px;font-size:13.5px;position:relative}
.flow div:first-child{border-radius:14px 0 0 14px}.flow div:last-child{border-radius:0 14px 14px 0}
.flow div+div{border-left:2px solid var(--sand)}
.flow b{display:block;color:var(--tan);font-size:12px;letter-spacing:.1em;text-transform:uppercase}

/* tables */
.tbl-wrap{overflow-x:auto;background:#fff;border-radius:16px;box-shadow:0 0 0 1px var(--line);margin:14px 0}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:10px 14px;text-align:right;border-bottom:1px solid #eee5d6;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
thead th{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--card);position:sticky;top:0}
tr.total td{font-weight:600;border-top:2px solid var(--ink)}
tr.sub td:first-child{padding-left:28px;color:var(--ink-2)}
td.hl{background:#fbf3e2}
caption{caption-side:bottom;text-align:left;padding:10px 14px;font-size:12.5px;color:var(--muted)}

/* ratio cards */
.group{margin-top:56px}
.group-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.group-h h3{margin:0}
.group-h span{font-size:14px;color:var(--muted)}
.ratios{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.ratios>*{min-width:0}
.ratio{background:#fff;border-radius:18px;padding:20px;box-shadow:0 0 0 1px var(--line)}
.ratio .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ratio .val{font-size:32px;font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--navy);white-space:nowrap}
.ratio .val small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.06em;text-align:right;margin-top:4px}
.formula{display:inline-block;background:var(--paper);border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:500;margin:10px 0}
.work{font-size:13.5px;color:var(--ink-2);margin:0 0 10px}
.work b{color:var(--ink)}
.spark{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:end;height:64px;margin:6px 0 4px}
.spark i{display:block;background:var(--s1);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.spark i.neg{background:var(--s2)}
.spark-l{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;font-size:11px;color:var(--muted);text-align:center}
.spark-l span b{display:block;color:var(--ink);font-weight:600;font-size:11.5px}
.means{font-size:14px;margin:10px 0 0}
.means b{color:var(--ink)}
.watch{font-size:13px;color:var(--bad);margin-top:6px}

/* exercises */
.ex{background:var(--ink);color:#f4ead6;border-radius:18px;padding:20px;margin-top:16px;grid-column:1 / -1}
.ex-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ex-h b{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tan)}
.ex-h .done{font-size:12px;color:#9fd3b6}
.ex p{color:#cfd6e6;font-size:14.5px;margin:8px 0 12px}
.ex .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ex input{width:160px;max-width:100%;font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:0;background:#f4ead6;color:var(--ink)}
.ex .unit{font-size:14px;color:#cfd6e6}
.btn{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--tan);color:var(--ink)}
.btn.ghost{background:transparent;color:#f4ead6;box-shadow:inset 0 0 0 1.5px #4a5a7e}
.fb{font-size:14px;margin-top:10px;min-height:1.4em}
.fb.ok{color:#9fd3b6}.fb.no{color:#f3b2a3}
.sol{background:#1c2e52;border-radius:12px;padding:12px 14px;margin-top:10px;font-size:14px;color:#e6ebf5}

/* charts */
.chart{background:#fff;border-radius:18px;padding:18px 18px 12px;box-shadow:0 0 0 1px var(--line);margin:18px 0;position:relative}
.chart h4{margin-bottom:2px}
.chart .sub{font-size:13px;color:var(--muted);margin-bottom:8px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:3px;border-radius:2px;vertical-align:3px;width:16px}
svg.c{width:100%;height:auto;display:block;overflow:visible}
svg.c text{font-family:var(--font);fill:var(--muted);font-size:11px}
svg.c .lab{fill:var(--ink);font-weight:600;font-size:11.5px}
svg.c .grid{stroke:#ece4d6;stroke-width:1}
svg.c .axis{stroke:#cbbfa9;stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#f4ead6;font-size:12.5px;padding:8px 10px;border-radius:10px;box-shadow:0 8px 20px rgba(15,27,51,.25);white-space:nowrap;z-index:5;transform:translate(-50%,-110%)}
.tip b{color:var(--tan)}
.tip[hidden]{display:none}
details.tview{margin-top:6px;font-size:13px}
details.tview summary{cursor:pointer;color:var(--navy);font-weight:500}

/* verdict */
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.vgrid>*{min-width:0}
.vcard{background:#1c2e52;border-radius:18px;padding:22px}
.vcard h4{color:var(--tan);font-size:18px;margin-bottom:10px}
.vcard ul{margin:0;padding-left:18px;color:#e6ebf5;font-size:14.5px}
.vcard li{margin-bottom:8px}
.take{background:var(--tan);color:var(--ink);border-radius:18px;padding:22px;margin-top:16px;font-size:16px}
.take b{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
.gloss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gloss>*{min-width:0}
.gloss div{background:var(--card);border-radius:14px;padding:14px;font-size:13.5px;color:var(--ink-2)}
.gloss b{display:block;color:var(--ink);font-size:14.5px}
footer{background:var(--ink);color:#a9b4cb;font-size:13px}
footer .wrap{padding-block:26px calc(26px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
footer a{color:var(--tan)}

/* reveal */
[data-rv]{transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv-pre{opacity:.15;transform:translateY(40px)}
.rv-pre.rv-up{transform:translateY(-40px)}

@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols,.gloss{grid-template-columns:1fr 1fr}
  .ratios,.vgrid{grid-template-columns:1fr}
  .idx a.opt{display:none}
}
@media (max-width:640px){
  .bar-in{grid-template-columns:auto minmax(0,1fr);gap:4px 10px;padding-block:8px}
  .idx{grid-column:1 / -1;grid-row:2;justify-content:safe center;overflow-x:auto;scrollbar-width:none;margin:0 -6px}
  .idx a{padding:6px 9px}.idx a.opt{display:inline}
  .mark small{display:none}
  .hero{padding-block:36px 80px}
  section{padding-block:68px}
  .cols,.gloss{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}
  .flow div:first-child{border-radius:14px 14px 0 0}.flow div:last-child{border-radius:0 0 14px 14px}
  .flow div+div{border-left:0;border-top:2px solid var(--sand)}
  .stat b{font-size:24px}
  .ratio .val{font-size:26px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

const NS = "http://www.w3.org/2000/svg";
function scale(d0,d1,r0,r1){ return v => r0 + (v-d0)/(d1-d0)*(r1-r0); }
function niceMax(v){ const p = Math.pow(10, Math.floor(Math.log10(v))); const m = v/p; return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p; }

function barChart(el, opt){
  const W=640,H=280,L=48,Rr=16,T=16,Bm=30, iw=W-L-Rr, ih=H-T-Bm;
  const dmax = Math.max(...opt.series.flatMap(s=>s.data)), step = niceMax(dmax/5), max = Math.ceil(dmax/step)*step, nt = Math.round(max/step);
  const y = scale(0,max,T+ih,T), gw = iw/opt.cats.length, n = opt.series.length, bw = Math.min(34,(gw-18)/n);
  let s = `<svg class="c" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria)}">`;
  for(let i=0;i<=nt;i++){ const v=step*i, yy=y(v); s+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${opt.fmtAxis(v)}</text>`; }
  opt.cats.forEach((c,i)=>{
    const gx = L + gw*i + (gw - (bw*n + 2*(n-1)))/2;
    opt.series.forEach((se,j)=>{
      const v=se.data[i], x=gx+j*(bw+2), yy=y(Math.max(v,0)), h=Math.abs(y(v)-y(0));
      s+=`<path d="M${x},${y(0)} V${yy+4} Q${x},${yy} ${x+4},${yy} H${x+bw-4} Q${x+bw},${yy} ${x+bw},${yy+4} V${y(0)} Z" fill="${se.color}" data-tip="${esc(`${opt.labels[i]} · ${se.name}: <b>${opt.fmt(v)}</b>`)}"/>`;
      if(i===opt.cats.length-1) s+=`<text class="lab" x="${x+bw/2}" y="${yy-6}" text-anchor="middle">${opt.fmtShort(v)}</text>`;
    });
    s+=`<text x="${L+gw*i+gw/2}" y="${H-8}" text-anchor="middle">${opt.cats[i]}</text>`;
  });
  s+=`<line class="axis" x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
  el.insertAdjacentHTML("beforeend", s);
  hoverMarks(el);
}
function lineChart(el, opt){
  const W=640,H=opt.h||280,L=48,Rr=opt.right||70,T=16,Bm=30, iw=W-L-Rr, ih=H-T-Bm, n=opt.x.length;
  const all = opt.series.flatMap(s=>s.data);
  const min = opt.min!=null?opt.min:0, max = opt.max||niceMax(Math.max(...all));
  const x = scale(0,n-1,L,L+iw), y = scale(min,max,T+ih,T);
  let s = `<svg class="c" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria)}">`;
  const ticks = opt.ticks || 4;
  for(let i=0;i<=ticks;i++){ const v=min+(max-min)*i/ticks, yy=y(v); s+=`<line class="grid" x1="${L}" x2="${L+iw}" y1="${yy}" y2="${yy}"/><text x="${L-8}" y="${yy+4}" text-anchor="end">${opt.fmtAxis(v)}</text>`; }
  (opt.xTicks||opt.x.map((_,i)=>i)).forEach(i=>{ s+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle">${opt.xLabel(i)}</text>`; });
  s+=`<line class="axis" x1="${L}" x2="${L+iw}" y1="${y(min)}" y2="${y(min)}"/>`;
  if(opt.ref!=null) s+=`<line x1="${L}" x2="${L+iw}" y1="${y(opt.ref)}" y2="${y(opt.ref)}" stroke="#b9ad97" stroke-dasharray="4 4"/>`;
  opt.series.forEach(se=>{
    const pts = se.data.map((v,i)=> v==null?null:[x(i),y(v)]).filter(Boolean);
    s+=`<polyline fill="none" stroke="${se.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p=>p.join(",")).join(" ")}"/>`;
    if(opt.dots) se.data.forEach((v,i)=>{ s+=`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="${se.color}" stroke="#fff" stroke-width="2"/>`; });
    const last = pts[pts.length-1]; s+=`<circle cx="${last[0]}" cy="${last[1]}" r="5" fill="${se.color}" stroke="#fff" stroke-width="2"/><text class="lab" x="${last[0]+10}" y="${last[1]+4+(se.dy||0)}">${esc(se.end)}</text>`;
  });
  s+=`<line class="xh" x1="0" x2="0" y1="${T}" y2="${T+ih}" stroke="#14233f" stroke-opacity=".25" visibility="hidden"/>`;
  s+=`<rect x="${L}" y="${T}" width="${iw}" height="${ih}" fill="transparent" class="hit"/></svg>`;
  el.insertAdjacentHTML("beforeend", s);
  const svg = el.querySelector("svg.c:last-of-type"), tip = el.querySelector(".tip"), xh = svg.querySelector(".xh"), hit = svg.querySelector(".hit");
  function move(ev){
    const r = svg.getBoundingClientRect(), px = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(n-1, Math.round((px - L)/iw*(n-1))));
    xh.setAttribute("x1", x(i)); xh.setAttribute("x2", x(i)); xh.setAttribute("visibility","visible");
    tip.innerHTML = `${esc(opt.tipX(i))}<br>` + opt.series.map(se=>`<span style="color:${se.color}">●</span> ${esc(se.name)}: <b>${opt.fmt(se.data[i])}</b>`).join("<br>");
    const er = el.getBoundingClientRect(); tip.style.left = (x(i)/W*r.width + r.left - er.left) + "px"; tip.style.top = (r.top - er.top + 30) + "px"; tip.hidden = false;
  }
  hit.addEventListener("pointermove", move); hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", ()=>{ tip.hidden = true; xh.setAttribute("visibility","hidden"); });
}
function hoverMarks(el){
  const tip = el.querySelector(".tip");
  el.querySelectorAll("[data-tip]").forEach(m=>{
    const show = ev => { tip.innerHTML = m.getAttribute("data-tip"); const er = el.getBoundingClientRect(), mr = m.getBoundingClientRect(); tip.style.left = (mr.left + mr.width/2 - er.left) + "px"; tip.style.top = (mr.top - er.top) + "px"; tip.hidden = false; m.style.opacity = .85; };
    m.addEventListener("pointerenter", show); m.addEventListener("pointerdown", show);
    m.addEventListener("pointerleave", ()=>{ tip.hidden = true; m.style.opacity = 1; });
  });
}

  </div></div>

  <div class="group"><div class="group-h"><h3>Cash flow</h3><span>Is the profit real cash?</span></div><div class="ratios">
    ${ratio({name:"Free cash flow margin",formula:"(Operating cash flow − capex) ÷ revenue",get:fy=>k(fy,"fcf_margin"),fmt:v=>P(v,0),work:`FY2026: ${B(k("FY26","fcf"))} ÷ ${B(f26.rev)} = <b>${P(k("FY26","fcf_margin"))}</b>`,means:"Almost 45 cents of free cash from every dollar of sales, one of the highest of any large company."})}
    ${ratio({name:"Cash conversion",formula:"Operating cash flow ÷ net income",get:fy=>k(fy,"cash_conv"),fmt:v=>X(v,2),work:`FY2026: ${B(f26.ocf)} ÷ ${B(f26.ni)} = <b>${X(k("FY26","cash_conv"),2)}</b>`,means:"Near 1× means profits are backed by real cash. Well below 1× for several years would be a red flag.",watch:"Slightly under 1× because cash was tied up in growing inventory and receivables, and because investment gains aren't cash."})}
    ${exHTML("fcf")}
  </div></div>

  <div class="tbl-wrap" data-rv><table><thead><tr><th>All ratios</th>${Y.map(fy=>`<th>${LABEL[fy]}</th>`).join("")}</tr></thead><tbody>
    ${[["Revenue growth","rev_growth",v=>P(v)],["Gross margin","gm",v=>P(v)],["Operating margin","om",v=>P(v)],["Net margin","nm",v=>P(v)],["ROE","roe",v=>P(v)],["ROA","roa",v=>P(v)],["Current ratio","current",v=>X(v,2)],["Quick ratio","quick",v=>X(v,2)],["Debt-to-equity","de",v=>v.toFixed(2)],["Days inventory","dio",v=>Math.round(v)],["Days to get paid","dso",v=>Math.round(v)],["FCF margin","fcf_margin",v=>P(v)],["Cash conversion","cash_conv",v=>X(v,2)],["Stock pay % of revenue","sbc_pct",v=>P(v)],["Buybacks + dividends % of FCF","sh_return_pct_fcf",v=>P(v,0)]].map(([n,key,fm])=>`<tr><td>${n}</td>${Y.map(fy=>`<td class="num ${fy==="FY26"?"hl":""}">${fm(k(fy,key))}</td>`).join("")}</tr>`).join("")}
  </tbody><caption>ROE, ROA and inventory days use the average of opening and closing balances.</caption></table></div>
</div></section>

<section class="s-sand" id="stock"><div class="wrap">
  <span class="lesson-no">LESSON 3</span>
  <h2 class="big">The stock: <em>price vs value</em></h2>
  <p class="sec-lede">A great company isn't automatically a great investment. What matters is what you pay. Valuation ratios compare the share price with what the business earns.</p>
  <div class="chart" data-rv id="ch-stock"><h4>$100 invested five years ago</h4><div class="sub">NVIDIA vs the S&amp;P 500 (via the SPY fund), weekly closing prices, split-adjusted, excluding dividends.</div>
    <div class="legend"><span><i class="ln" style="background:var(--s1)"></i>NVIDIA</span><span><i class="ln" style="background:var(--s2)"></i>S&amp;P 500</span></div><div class="tip" hidden></div></div>
  <div class="note"><span class="ic">↗</span><p>From ${esc(D.series[0][0])} to ${esc(V.price_date)}, NVIDIA's share price rose <b>${Math.round(totalReturn)}%</b>, while the S&amp;P 500 rose <b>${Math.round(spyReturn)}%</b>. Notice the fall in 2022: the share price roughly halved before the AI boom. High-growth stocks swing hard in both directions.</p></div>
  <div class="note warn"><span class="ic">!</span><p><b>Volatility, live.</b> In the weeks before this analysis, the price fell from about $230 in early October 2026 to $125.53 on 20 November, then jumped back to about $${V.price} on ${esc(V.price_date)}. The company's results didn't change that much in six weeks; investors' expectations did. That's why analysts separate a company's <i>value</i> from its share <i>price</i>. The ${esc(V.price_date)} price used on this page is a mid-day price.</p></div>

  <div class="group"><div class="group-h"><h3>Valuation</h3><span>Is the price reasonable for what it earns?</span></div><div class="ratios">
    ${ratio({name:"P/E at each fiscal year-end",formula:"Share price ÷ earnings per share",get:fy=>k(fy,"pe_fyend"),fmt:v=>X(v,0),work:`Today: $${V.price} ÷ FY2026 EPS $${f26.eps.toFixed(2)} = <b>${X(V.pe_fy26)}</b>. Using the last 12 months' EPS ($${V.ttm.eps.toFixed(2)}) instead: <b>${X(V.pe_ttm)}</b>.`,means:"How many dollars investors pay for $1 of yearly profit. The S&P 500 has historically averaged roughly 15–20×. A high P/E means the market expects strong growth to continue.",watch:"The P/E falls fast when profits grow faster than the price, as here. The 'last 12 months' figure includes investment gains, which flatters it."})}
    ${ratio({name:"Price-to-sales at year-end",formula:"Market value ÷ revenue",get:fy=>k(fy,"ps_fyend"),fmt:v=>X(v,0),work:`Today: $${(V.mcap_b/1000).toFixed(2)}T ÷ last-12-month revenue ${B(V.ttm.rev)} = <b>${X(V.ps_ttm)}</b>`,means:"Useful when profits are unusual. Most large companies trade at 1–5× sales. NVIDIA's ratio is high because its margins are so high."})}
    ${exHTML("pe")}
  </div></div>
  <div class="cols" style="margin-top:16px">
    <div class="card" data-rv><div class="q">Market value</div><p><b class="num">$${(V.mcap_b/1000).toFixed(2)} trillion</b> = $${V.price} × ${(V.shares_m/1000).toFixed(1)}B shares. This is what the whole company is worth on the stock market.</p></div>
    <div class="card" data-rv><div class="q">Free cash flow yield</div><p><b class="num">${P(V.fcf_yield_fy26,1)}</b> = FY2026 free cash flow ÷ market value. If you bought the whole company, that's the cash return per year at today's size.</p></div>
    <div class="card" data-rv><div class="q">Dividend yield</div><p><b class="num">${P(V.div_yield,2)}</b>. NVIDIA pays only $0.01 a quarter per share and returns cash mainly through buybacks: ${B(f26.buyback)} in FY2026.</p></div>
  </div>
</div></section>

<section class="s-ink" id="verdict"><div class="wrap">
  <span class="lesson-no">LESSON 4</span>
  <h2 class="big">Putting it <em>together</em></h2>
  <p class="sec-lede">An analyst's job is to turn all these numbers into a balanced view. Here's how I'd summarise NVIDIA, using only what the data above shows.</p>
  <div class="vgrid">
    <div class="vcard" data-rv><h4>Strengths (the bull case)</h4><ul>
      <li>Revenue grew from ${B(R.FY22.rev)} to ${B(f26.rev)} in four years.</li>
      <li>Margins at the top of any large company: 71% gross, 60% operating.</li>
      <li>Profits are real cash: ${B(k("FY26","fcf"))} free cash flow in FY2026.</li>
      <li>A rock-solid balance sheet, with debt only 5% of equity and a current ratio near 4×.</li>
      <li>Big returns to shareholders: ${B(f26.buyback+f26.div)} of buybacks and dividends in FY2026.</li>
    </ul></div>
    <div class="vcard" data-rv><h4>Risks (the bear case)</h4><ul>
      <li>FY2023 proves demand can stall: revenue flat, operating margin down to 16%.</li>
      <li>Growth is slowing (126% → 114% → 66%), and inventory doubled in FY2026.</li>
      <li>Gross margin slipped from 75% to 71%. Competitors and customers' own chips could push it lower.</li>
      <li>Part of recent profit comes from investment gains, which may not repeat.</li>
      <li>The share price already assumes a lot of future growth, and it halved in 2022.</li>
    </ul></div>
  </div>
  <div class="take" data-rv><b>My take</b>NVIDIA is an exceptionally strong <i>business</i>: high growth, high margins, real cash and almost no debt. Whether it's a good <i>investment</i> today depends on how long AI spending keeps growing. The numbers to watch each quarter are revenue growth, gross margin and inventory. If growth slows while inventory keeps rising, that's the first warning sign, just as in FY2023.</div>
  <p class="sec-lede" style="margin-top:18px;font-size:13px">Educational analysis for learning purposes, not investment advice.</p>
</div></section>

<section class="s-paper" id="glossary"><div class="wrap">
  <h2 class="big">Glossary <em>& sources</em></h2>
  <div class="gloss">
    <div><b>10-K / 10-Q</b>The annual and quarterly reports US companies must file with the SEC.</div>
    <div><b>EPS</b>Earnings per share: net income ÷ number of shares. "Diluted" includes shares that could be created from employee stock awards.</div>
    <div><b>Capex</b>Capital expenditure: money spent on long-lasting assets such as buildings and equipment.</div>
    <div><b>Free cash flow</b>Cash from operations minus capex. Cash the company can freely use.</div>
    <div><b>Buyback</b>A company buying its own shares, which gives each remaining share a bigger slice.</div>
    <div><b>Operating leverage</b>When revenue grows faster than costs, so margins rise.</div>
    <div><b>Last 12 months (LTM)</b>The latest four quarters added together. More up to date than the last fiscal year.</div>
    <div><b>Stock split</b>Dividing each share into several cheaper ones. The company's value doesn't change.</div>
    <div><b>Market value</b>Share price × number of shares. Also called market capitalisation.</div>
  </div>
  <div class="note" style="margin-top:22px"><span class="ic">§</span><p><b>Sources.</b> Financial statements: NVIDIA 10-K filings for FY2022–FY2026 and 10-Q filings for FY2027 to July 2026, via the <a href="https://www.sec.gov/edgar/browse/?CIK=1045810" target="_blank" rel="noopener">SEC EDGAR database</a>. Share prices: weekly closing prices from Yahoo Finance, split-adjusted, last price ${esc(V.price_date)}. Last-12-month figures run to 26 July 2026. All calculations by Krish Sinha.</p></div>
</div></section>
<footer><div class="wrap"><span>© Krish Sinha · NVIDIA case study</span><a href="index.html">Back to portfolio ↗</a></div></footer>`;

/* waterfall */
(function(){
  const el = document.getElementById("ch-wf"), W=640,H=270,L=48,Rr=16,T=16,Bm=44, iw=W-L-Rr, ih=H-T-Bm;
  const ocf=f26.ocf/1000, capex=f26.capex/1000, fcf=ocf-capex, bb=f26.buyback/1000, dv=f26.div/1000, left=fcf-bb-dv;
  const steps=[["Cash from operations",0,ocf,"in"],["Capital spending",fcf,ocf,"out"],["Free cash flow",0,fcf,"in"],["Buybacks",fcf-bb,fcf,"out"],["Dividends",left,fcf-bb,"out"],["Kept",0,left,"in"]];
  const step=niceMax(ocf/5), max=Math.ceil(ocf/step)*step, nt=Math.round(max/step), y=scale(0,max,T+ih,T), gw=iw/steps.length, bw=Math.min(54,gw-20);
  let s=`<svg class="c" viewBox="0 0 ${W} ${H}" role="img" aria-label="Free cash flow waterfall for FY2026">`;
  for(let i=0;i<=nt;i++){ const v=step*i, yy=y(v); s+=`<line class="grid" x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}"/><text x="${L-8}" y="${yy+4}" text-anchor="end">$${Math.round(v)}B</text>`; }
  steps.forEach(([n,a,b,t],i)=>{ const x=L+gw*i+(gw-bw)/2, y1=y(b), y0=y(a), val=b-a;
    s+=`<rect x="${x}" y="${y1}" width="${bw}" height="${Math.max(2,y0-y1)}" rx="4" fill="${t==="in"?"#2f55a4":"#b8862f"}" data-tip="${esc(n+": <b>"+(t==="out"?"−":"")+"$"+val.toFixed(1)+"B</b>")}"/>`;
    s+=`<text class="lab" x="${x+bw/2}" y="${y1-6}" text-anchor="middle">${t==="out"?"−":""}$${val.toFixed(1)}B</text>`;
    const words=n.split(" "); const l1=words.slice(0,2).join(" "), l2=words.slice(2).join(" ");
    s+=`<text x="${x+bw/2}" y="${H-24}" text-anchor="middle">${esc(l1)}</text>${l2?`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle">${esc(l2)}</text>`:""}`; });
  s+=`<line class="axis" x1="${L}" x2="${W-Rr}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
  el.insertAdjacentHTML("beforeend", s); hoverMarks(el);
})();

document.addEventListener("submit", ev => {
  const f = ev.target.closest("[data-ex]"); if(!f) return; ev.preventDefault();
  const id = f.dataset.ex, e = EX[id], raw = document.getElementById("in-"+id).value.replace(/[^0-9.\-]/g,""), v = parseFloat(raw), fb = document.getElementById("fb-"+id);

  const ok = Math.abs(v - e.ans) <= e.tol || (e.unit==="%" && Math.abs(v*100 - e.ans) <= e.tol);
  if(ok){ fb.className = "fb ok"; fb.textContent = "Correct. Nice work: that's exactly how an analyst would calculate it."; solved[id] = true; document.getElementById("done-"+id).textContent = "✓ Solved"; try{ localStorage.setItem("nvda-solved", JSON.stringify(solved)); }catch(err){} updateProgress(); }
  else { fb.className = "fb no"; fb.textContent = (v > e.ans ? "A bit high." : "A bit low.") + " Check which numbers you divided, or press Hint."; }
});

});
