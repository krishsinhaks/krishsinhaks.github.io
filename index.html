<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Krish Sinha · Portfolio</title><meta name="description" content="Krish Sinha – final-year International Business student in Vienna. Finance internships at BNP Paribas Real Estate and Komunikacja+."><meta property="og:title" content="Krish Sinha · Portfolio"><meta property="og:description" content="International Business student in Vienna. Warsaw → Vienna."><meta property="og:image" content="portrait.jpg"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="icon" href="favicon.png" type="image/png" sizes="48x48"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#14233f"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><style id="pf-style">
/* Layout: beige canvas with navy ink; giant taupe name behind a cut-out portrait, then big-type section titles with collage elements. Single light theme by choice. */
:root{
  --sand:#ece3d3; --sand-2:#e2d6c1; --taupe:#7d8aa6; --ink:#14233f; --ink-2:#3d4b68;
  --orange:#24407a; --paper:#f8f3ea; --line:#d5c8b1; --tan:#e2cfa9;
  --font:"Poppins",ui-sans-serif,system-ui,sans-serif;
  color-scheme:light;
}
html{scroll-behavior:smooth}
body{background:var(--sand);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;margin:0;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;line-height:1;text-wrap:balance}
a{color:inherit}
button{font:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:3px}

/* slim index bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ink);color:#f4ead6;box-shadow:0 6px 20px rgba(15,27,51,.18)}
.bar-in{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:14px;min-height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mark{font-weight:800;letter-spacing:-.03em;font-size:19px;text-decoration:none;white-space:nowrap;color:#f4ead6}
.mark small{font-weight:500;font-size:11px;color:var(--tan);margin-left:8px;letter-spacing:.1em}
.idx{display:flex;gap:2px;justify-content:center;align-items:center;min-width:0}
.mark{justify-self:start}.bar .cta{justify-self:end}
.idx a{text-decoration:none;font-size:13.5px;font-weight:500;padding:7px 12px;border-radius:8px;color:#cfd6e6;white-space:nowrap}
.idx a b{font-weight:600;color:var(--tan);margin-right:6px;font-size:11px}
.idx a:hover{background:#22365e;color:#fff}
.bar .cta{background:var(--tan);color:var(--ink);font-weight:600;font-size:13.5px;text-decoration:none;padding:8px 14px;border-radius:8px;white-space:nowrap}
.bar .cta:hover{background:#efe0bf}

/* ticker */
.ticker{background:var(--paper);border-bottom:1px solid var(--line);overflow:hidden;position:relative}
.tk-track{display:flex;width:max-content;animation:tk 60s linear infinite}
.ticker:hover .tk-track{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
.tk{display:flex;align-items:center;gap:10px;padding:10px 24px;border-right:1px solid var(--line);white-space:nowrap;font-size:13px}
.tk .sic{transform:none}
.tk .logo-ic,.tk .glyph{width:28px;height:28px;border-radius:7px}
.tk .glyph svg{width:17px;height:17px}
.tk .flag-ic{width:28px;height:19px;border-radius:4px}
.tk .flags{flex-direction:row;gap:2px}.tk .flags i{width:13px;height:9px;border-radius:2px}
.tk .duo img{width:24px;height:24px;border-radius:6px}.tk .duo img+img{margin-left:-7px}
.tk b{font-weight:700;font-size:14px}
.tk .up{color:#2f7d5b;font-size:11px}
.tk .t{color:var(--ink-2)}

/* hero */
.hero{position:relative;padding-top:20px;min-height:760px;overflow:hidden}
.bigname{font-weight:800;color:var(--ink);font-size:clamp(96px,24vw,360px);letter-spacing:-.05em;line-height:.85;text-align:center;margin-top:20px;user-select:none}
.cutout{position:absolute;left:50%;bottom:48px;transform:translateX(-50%) rotate(-3deg);display:flex;justify-content:center;align-items:flex-end;z-index:1}
.cutout img{height:min(380px,46vh);width:auto;max-width:70vw;aspect-ratio:3/4;object-fit:cover;display:block;border:6px solid #fff;border-radius:22px;box-shadow:0 22px 44px rgba(15,27,51,.28)}
.cutout .ph-empty{width:min(320px,60vw);aspect-ratio:4/5;max-width:100%;border-radius:24px 24px 0 0;background:var(--ink);color:var(--sand);display:grid;place-items:center;font-weight:800;font-size:96px;letter-spacing:-.04em;box-shadow:0 0 0 6px #fff}
.hero-wrap{position:relative}
.surname{position:absolute;left:0;right:0;top:calc(20px + clamp(96px,24vw,360px) * .78);text-align:center;font-weight:800;font-size:clamp(96px,24vw,360px);letter-spacing:-.05em;line-height:.85;color:var(--ink);opacity:.09;z-index:0;user-select:none;pointer-events:none}
.editing .surname{pointer-events:auto;opacity:.3}
.stickers{position:absolute;inset:0;pointer-events:none;z-index:2}
.sticker{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--paper);color:var(--ink);border-radius:18px;padding:12px 16px 12px 12px;box-shadow:0 12px 30px rgba(15,27,51,.16);font-size:12.5px;line-height:1.35;transform:rotate(var(--rot,0deg));transition:box-shadow .2s;max-width:260px}
.sticker:hover{box-shadow:0 18px 40px rgba(15,27,51,.26)}
.sticker.dark{background:var(--ink);color:#f4ead6}
.sticker.tan{background:#e2cfa9;color:var(--ink)}
.stx{min-width:0}
.sticker b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.sticker .pl{display:block;white-space:pre-line;opacity:.85}
.sic{flex:none;display:grid;place-items:center}
.logo-ic{width:44px;height:44px;border-radius:12px;background:#fff;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.logo-ic img{width:80%;height:80%;object-fit:contain}
.flag-ic{width:44px;height:30px;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #fff}
.flag-ic svg,.flags svg{width:100%;height:100%;display:block}
.flags{display:flex;flex-direction:column;gap:3px}
.flags i{width:22px;height:14px;border-radius:3px;overflow:hidden;display:block}
.duo{display:flex}.duo img{width:34px;height:34px;border-radius:9px;background:#fff;box-shadow:0 0 0 2px var(--paper)}.duo img+img{margin-left:-10px}
.glyph{width:44px;height:44px;border-radius:12px;background:color-mix(in srgb,currentColor 12%,transparent)}
.glyph svg{width:26px;height:26px}
.s1{right:3%;top:40%}
.s2{right:23%;bottom:3%}
.s3{left:2.5%;top:38%}
.s4{left:5%;top:23%}
.s5{right:19%;top:58%}
.s6{right:14%;top:15%}
.s7{left:19%;top:56%}
.s8{right:2.5%;top:70%}
.s9{left:28%;top:79%}
.hello{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:64px;z-index:2;max-width:300px}
.hello small{display:block;font-size:22px;font-weight:600;line-height:1}
.hello h1{font-size:40px;font-weight:700;letter-spacing:-.03em;margin:4px 0 10px}
.hello p{margin:0;font-size:14px;color:var(--ink-2);white-space:pre-line}
.hero .edit-btn{left:50%;transform:translateX(-50%);bottom:16px;right:auto;z-index:3}

/* statement */
.statement{background:var(--paper);padding-block:110px;text-align:center}
.statement p{font-size:clamp(20px,2.6vw,30px);font-weight:500;line-height:1.45;max-width:30ch;margin:0 auto;letter-spacing:-.01em}
.statement p span{color:var(--taupe)}
.btn{display:inline-flex;align-items:center;gap:8px;margin-top:30px;background:var(--ink);color:#f4ede4;text-decoration:none;border:0;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:500;cursor:pointer}
.btn:hover{background:#22365e}
.btn.orange{background:var(--orange);color:#fff}

/* section titles */
.big{font-weight:700;color:var(--taupe);font-size:clamp(52px,9vw,120px);letter-spacing:-.045em;line-height:.92;text-align:center}
.big em{font-style:normal;color:var(--ink)}
.big > span,.big > em,.big > em > span{display:inline-block;will-change:translate}
.card,.tool,.lang,.chips > span,.row,.bigname,.sticker,.hello{will-change:translate}
.sec{padding-block:110px}

/* fanned cards */
.fan{display:flex;justify-content:center;align-items:flex-start;margin-top:-36px;padding-bottom:20px;flex-wrap:wrap}
.card{width:230px;max-width:100%;border-radius:22px;background:var(--ink);overflow:hidden;box-shadow:0 20px 40px rgba(15,27,51,.22);transition:transform .35s cubic-bezier(.2,.8,.2,1);margin:0 -10px;position:relative}
.card:nth-child(1){transform:rotate(-9deg) translateY(30px)}
.card:nth-child(2){transform:rotate(-3deg) translateY(-6px);z-index:2}
.card:nth-child(3){transform:rotate(4deg) translateY(6px);z-index:1}
.card:nth-child(4){transform:rotate(10deg) translateY(36px)}
.card:hover{transform:rotate(0) translateY(-14px) scale(1.03);z-index:5}
.card .art{height:190px;display:grid;place-items:center}
.card .art svg{width:130px;height:130px}
.card .lbl{padding:18px 18px 20px;color:#fff;font-weight:600;font-size:17px;line-height:1.2;text-align:center;min-height:84px;display:grid;place-items:center}
.card .lbl small{display:block;font-weight:400;font-size:12px;opacity:.9;margin-top:6px}
.g1 .lbl{background:linear-gradient(135deg,#14233f,#2b4a85)}
.g2 .lbl{background:linear-gradient(135deg,#2b4a85,#5577b5)}
.g3 .lbl{background:linear-gradient(135deg,#cdb083,#e2cfa9);color:#14233f}
.g4 .lbl{background:linear-gradient(135deg,#0d1830,#24407a)}

/* journey */
.journey{background:var(--paper)}
.rows{list-style:none;margin:56px 0 0;padding:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:72px minmax(0,1.2fr) minmax(0,1.6fr) auto;gap:24px;align-items:center;padding-block:22px;border-bottom:1px solid var(--line);transition:background .2s}
.row:hover{background:var(--sand)}
.row>*{min-width:0}
.logo{position:relative;width:72px;height:72px;border-radius:18px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.logo img{width:78%;height:78%;object-fit:contain}
.logo .mono{font-weight:700;font-size:18px;color:var(--ink)}
.row h3{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.15}
.row .org{font-size:14px;color:var(--ink-2);margin-top:4px}
.row p{margin:0;font-size:14px;color:var(--ink-2)}
.when{font-size:13px;font-weight:500;white-space:nowrap;background:var(--ink);color:#f4ede4;border-radius:999px;padding:5px 12px;font-variant-numeric:tabular-nums}
.when.soft{background:transparent;color:var(--taupe);border:1px solid var(--line)}
.subhead{font-size:14px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--taupe);margin:64px 0 0}
.subhead+.rows{margin-top:16px}

/* archive */
.archive{position:relative;background:var(--paper);overflow:clip}
.archive .big{color:#e4dccd;position:sticky;top:calc(50vh - 110px);z-index:0}
.field{position:relative;height:1100px;margin-top:-180px}
.float{position:absolute;margin:0;width:var(--w);z-index:1;will-change:translate}
.float img{width:100%;display:block;border-radius:12px;box-shadow:0 18px 40px rgba(15,27,51,.18)}
.float figcaption{font-size:12px;color:var(--ink-2);margin-top:8px}
.arch-empty{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--ink-2);z-index:1;width:min(420px,90%)}
.arch-empty strong{display:block;color:var(--ink);font-size:22px;margin-bottom:4px}
.folder{position:absolute;width:70px;height:56px;z-index:0}
.grid-edit{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:40px}
.tile{margin:0;position:relative;background:var(--paper);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.tile img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.tile input{width:100%;box-sizing:border-box;border:0;border-top:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px 12px;font:inherit;font-size:14px}

/* toolkit */
.tools{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px 18px;margin-top:56px;padding-block:12px}
.tool{background:var(--paper);border-radius:20px;padding:18px;display:flex;align-items:center;gap:14px;min-height:88px;box-shadow:0 14px 30px rgba(15,27,51,.10);transition:background .2s,box-shadow .2s}
.tool:nth-child(even){margin-top:26px}
.tool:hover{background:#fff;box-shadow:0 18px 40px rgba(15,27,51,.18)}
.appicon{flex:none;width:48px;height:48px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:#fff;box-shadow:0 2px 8px rgba(15,27,51,.12)}
.appicon img,.appicon svg{width:100%;height:100%;display:block;object-fit:contain}
.tool-txt{min-width:0}
.tool b{font-size:17px;font-weight:600;letter-spacing:-.01em;display:block;line-height:1.25}
.tool span{font-size:13px;color:var(--ink-2)}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-12px) rotate(calc(var(--r,0deg) * -0.4))}}
.floaty{animation:floaty var(--d,5s) ease-in-out var(--dl,0s) infinite}
.floaty:hover{animation-play-state:paused}

/* languages */
.langs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:56px}
.lang{background:var(--ink);color:#f4ede4;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.lang .lv{font-size:44px;font-weight:700;letter-spacing:-.04em;line-height:1}
.lang-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.flag{width:42px;height:28px;border-radius:6px;overflow:hidden;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.flag svg{width:100%;height:100%;display:block}
.langs{padding-block:12px}
.lang:nth-child(even){margin-top:22px}
.lang .nm{font-size:15px;font-weight:500}
.lang .nm small{display:block;color:#a9b4cb;font-size:12px;font-weight:400}
.bars{display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.bars span{height:6px;border-radius:2px;background:#2c3d63}
.bars span.on{background:#e2cfa9}

/* beyond */
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:48px;max-width:900px;margin-inline:auto}
.chips span{background:var(--paper);border-radius:999px;padding:12px 20px;font-size:15px;font-weight:500}
.chips span:nth-child(3n+1){transform:rotate(-2deg)}
.chips span:nth-child(3n+2){transform:rotate(1.5deg);background:var(--ink);color:#f4ede4}
.chips span:nth-child(5){background:var(--orange);color:#fff}

/* contact */
.contact{text-align:center;padding-block:130px 150px}
.contact p{font-size:18px;color:var(--ink-2);max-width:44ch;margin:22px auto 0}
.contact .actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:10px}
footer{padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);font-size:13px;color:var(--ink-2);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

/* edit */
.edit-btn{position:absolute;right:8px;bottom:8px;font-size:12px;padding:5px 10px;border-radius:999px;border:0;background:var(--ink);color:#f4ede4;cursor:pointer}
.logo .edit-btn{left:0;right:0;bottom:0;border-radius:0;font-size:10px;padding:3px 0;opacity:0;transition:opacity .15s}
.logo:hover .edit-btn,.logo:focus-within .edit-btn{opacity:1}
.tile .edit-btn{top:8px;bottom:auto}
.toolbar{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;gap:8px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 6px 6px 16px;box-shadow:0 10px 30px rgba(15,27,51,.2);z-index:40;font-size:14px;max-width:calc(100vw - 32px)}
.toolbar .status{color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toolbar .btn{margin:0;padding:8px 16px;font-size:14px;flex:none}
.hint{font-size:13px;color:var(--ink-2);text-align:center;margin-top:12px}

/* page-like sections and scroll reveal */
section{position:relative;border-radius:44px 44px 0 0;margin-top:-44px;background:var(--sand);box-shadow:0 -18px 40px rgba(15,27,51,.07)}
.pl{white-space:pre-line}
[data-rv]{transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.rv-pre{opacity:.12;transform:translateY(56px)}
.big.rv-pre{transform:translateY(80px) skewY(3deg)}
.fan.rv-pre{transform:translateY(100px) scale(.92)}
.row.rv-pre{transform:translateX(-40px)}
.rv-pre.rv-up{transform:translateY(-56px)}
.big.rv-pre.rv-up{transform:translateY(-80px) skewY(-3deg)}
.fan.rv-pre.rv-up{transform:translateY(-100px) scale(.92)}
.row.rv-pre.rv-up{transform:translateX(40px)}

/* text editing */
.editing [data-k]{outline:1.5px dashed color-mix(in srgb,currentColor 50%,transparent);outline-offset:3px;border-radius:4px;cursor:text;min-width:1ch;display:inline-block}
.editing .bigname[data-k],.editing p[data-k]{display:block}
.editing [data-k]:hover{outline-style:solid}
.editing [data-k]:focus{outline:2px solid currentColor;background:color-mix(in srgb,currentColor 8%,transparent)}
.editing [data-k]:empty::before{content:"Add text";opacity:.45}
.editing .floaty{animation:none}
.editing .tk-track{animation:none;flex-wrap:wrap;width:auto}
.editing .card,.editing .card:hover{transform:none!important;margin:8px}

/* route timeline */
.journey .big{margin-bottom:48px}
.route{position:relative;list-style:none;margin:0;padding:0}
.route::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed var(--orange);transform:translateX(-1.5px)}
.terminus{display:flex;justify-content:center;margin:0 0 22px}
.terminus.end{margin:22px 0 0}
.terminus span{position:relative;z-index:1;background:var(--ink);color:#f4ead6;font-size:12px;font-weight:600;letter-spacing:.14em;padding:8px 16px;border-radius:99px}
.stop{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr);align-items:center;margin-block:16px}
.stop .dot{grid-column:2;grid-row:1;justify-self:center;width:22px;height:22px;border-radius:50%;background:var(--paper);border:4px solid var(--orange);z-index:1}
.stop.vie .dot{background:var(--tan)}
.rcard{grid-row:1;background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 12px 28px rgba(15,27,51,.09);display:grid;grid-template-columns:56px minmax(0,1fr);gap:2px 14px;align-items:start;position:relative}
.stop.l .rcard{grid-column:1}.stop.r .rcard{grid-column:3}
.rcard .logo{grid-row:span 3;width:56px;height:56px}
.rcard h3{font-size:18px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.rcard .org{font-size:13px;color:var(--ink-2)}
.rcard p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
.when-side{grid-row:1;display:flex;flex-direction:column;gap:4px;font-size:13px}
.stop.l .when-side{grid-column:3;align-items:flex-start;padding-left:4px}
.stop.r .when-side{grid-column:1;align-items:flex-end;text-align:right;padding-right:4px}
.city-tag{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--taupe)}
.land{position:relative;display:flex;justify-content:center;margin:26px 0}
.land figure{position:relative;z-index:1;margin:0;width:min(560px,100%);background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 22px 48px rgba(15,27,51,.2);transform:rotate(var(--rot,-1.5deg))}
.land img{width:100%;height:clamp(180px,32vw,300px);object-fit:cover;display:block}
.land figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:12px 16px}
.land figcaption b{font-size:15px;font-weight:600}
.land figcaption small{font-size:11px;color:var(--taupe)}
.land figcaption small a{color:inherit}
.land .pin{position:absolute;left:14px;top:14px;background:var(--ink);color:#f4ead6;font-size:11px;font-weight:600;letter-spacing:.14em;padding:5px 10px;border-radius:99px}
.land .edit-btn{top:12px;right:12px;bottom:auto}
.crossing{position:relative;display:flex;justify-content:center;margin:30px 0 0}
.crossing span{position:relative;z-index:1;background:var(--tan);color:var(--ink);font-size:12px;font-weight:600;letter-spacing:.1em;padding:7px 14px;border-radius:99px;text-transform:uppercase}
.stop.l.rv-pre{transform:translateX(-60px)}.stop.r.rv-pre{transform:translateX(60px)}
.land.rv-pre{transform:translateY(60px) scale(.94)}
.land.rv-pre.rv-up{transform:translateY(-60px) scale(.94)}

/* case study */
.case{background:var(--ink);color:#f4ead6}
.case-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center}
.case-grid>*{min-width:0}
.case-tag{display:inline-block;background:var(--tan);color:var(--ink);font-size:12px;font-weight:600;letter-spacing:.14em;padding:5px 12px;border-radius:99px}
.case-title{font-size:clamp(44px,7vw,92px);font-weight:800;letter-spacing:-.05em;line-height:.92;margin:18px 0 18px;color:#f4ead6}
.case-p{font-size:17px;color:#cfd6e6;max-width:50ch;margin:0}
.case-btns{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:26px}
.case-go{margin:0;background:var(--tan);color:var(--ink)}
.case-go:hover{background:#efe0bf}
.case-meta{font-size:13px;color:#a9b4cb}
.case-card{display:block;text-decoration:none;color:var(--ink);background:var(--paper);border-radius:24px;padding:22px;box-shadow:0 24px 50px rgba(0,0,0,.3);transform:rotate(2deg);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.case-card:hover{transform:rotate(0) translateY(-6px)}
.cc-top{display:flex;justify-content:space-between;font-size:12px;font-weight:600;letter-spacing:.14em;color:var(--taupe)}
.cc-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:16px 0 18px}
.cc-stats b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.cc-stats small{font-size:12px;color:var(--ink-2)}
.cc-bars{width:100%;height:auto;display:block}
.cc-bars rect{fill:var(--orange)}
.cc-bars rect:last-child{fill:#b8862f}
.cc-foot{font-size:11.5px;color:var(--taupe);margin-top:8px}

/* scroll reveal: only things still below the screen get the entrance animation */
let rvObs = null;
function reveal(){
  if(rvObs){ rvObs.disconnect(); rvObs = null; }
  if(editing || !("IntersectionObserver" in window) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  rvObs = new IntersectionObserver(entries => {
    entries.forEach(en => { const c = en.target.classList;
      if(en.isIntersecting){ c.add("rv-in"); c.remove("rv-pre"); }
      else { c.remove("rv-in"); c.add("rv-pre"); c.toggle("rv-up", en.boundingClientRect.top < 0); } });
  }, {rootMargin:"0px 0px -8% 0px", threshold:0.08});
  document.querySelectorAll("[data-rv]").forEach(el => {
    if(el.getBoundingClientRect().top > innerHeight) el.classList.add("rv-pre");
    rvObs.observe(el);
  });
}

/* inline text editing */
app.addEventListener("focusin", ev => { const el = ev.target; if(editing && el.dataset && el.dataset.k) el.dataset.before = el.innerText; });
app.addEventListener("keydown", ev => {
  const el = ev.target; if(!editing || !el.dataset || !el.dataset.k) return;
  if(ev.key === "Enter" && !el.dataset.ml){ ev.preventDefault(); el.blur(); }
  if(ev.key === "Escape"){ el.innerText = el.dataset.before || ""; el.blur(); }
});
app.addEventListener("paste", ev => {
  const el = ev.target.closest && ev.target.closest("[data-k]"); if(!editing || !el) return;
  ev.preventDefault(); const txt = (ev.clipboardData || window.clipboardData).getData("text/plain");
  document.execCommand("insertText", false, el.dataset.ml ? txt : txt.replace(/\s*\n\s*/g," "));
});
app.addEventListener("focusout", ev => {
  const el = ev.target; if(!editing || !el.dataset || !el.dataset.k) return;
  let v = el.innerText.replace(/ /g," ").replace(/\n{3,}/g,"\n\n").trim();
  if(!el.dataset.ml) v = v.replace(/\s*\n\s*/g," ");
  if(v === (el.dataset.before||"").trim()) return;
  state.text[el.dataset.k] = v.slice(0, 1200); save();
});

  const small = innerWidth <= 640, k = small ? 0.5 : 1;
  PX.forEach(([sel, ys, xs]) => {
    if(sel === ".sticker" && innerWidth <= 1100) return;
    if(innerWidth <= 640 && [".bigname",".surname",".cutout",".hello"].includes(sel)) return;
    document.querySelectorAll(sel).forEach((el, i) => {
      if(ys === null){ if(small) return; const s = +el.dataset.speed * 0.35; pxEls.push({el, sy:s, sx:0}); return; }
      const sy = ys[i % ys.length] * k, sx = xs[i % xs.length] * k;
      if(!sy && !sx) return;
      pxEls.push({el, sy, sx});
    });
  });
  measure(); parallax();
}
function measure(){
  pxEls.forEach(o => { o.el.style.translate = ""; });
  pxEls.forEach(o => { const r = o.el.getBoundingClientRect(); o.mid = r.top + scrollY + r.height / 2; o.float = o.el.classList.contains("float"); });
}
function parallax(){
  const vmid = scrollY + innerHeight / 2;
  for(const o of pxEls){
    const d = o.mid - vmid;
    if(o.float){ o.el.style.translate = `0 ${(-(vmid - o.mid + innerHeight) * o.sy).toFixed(1)}px`; continue; }
    if(Math.abs(d) > innerHeight * 1.6) continue;
    const y = Math.max(-160, Math.min(160, d * o.sy)), x = Math.max(-220, Math.min(220, d * o.sx));
    o.el.style.translate = `${x.toFixed(1)}px ${y.toFixed(1)}px`;
  }
}
addEventListener("scroll", () => { if(!ticking){ ticking = true; requestAnimationFrame(() => { parallax(); ticking = false; }); } }, {passive:true});
let rsT = null;
addEventListener("resize", () => { clearTimeout(rsT); rsT = setTimeout(setupPx, 150); });
addEventListener("load", () => { measure(); parallax(); });
try{ document.fonts && document.fonts.ready.then(() => { measure(); parallax(); }); }catch(e){}

function setStatus(m){ statusMsg = m; const s = document.getElementById("status"); if(s) s.textContent = m; }

function buildDocument(){
  const headStyle = (document.head.querySelector("style")||{}).textContent || ":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}";
  const json = JSON.stringify({photo:state.photo,logos:state.logos,gallery:state.gallery,text:state.text,project:state.project,cv:state.cv,landmarks:state.landmarks}).replace(/</g,"\\u003c");
  const fonts = document.querySelector('link[href*="fonts.googleapis"]');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + headStyle + '</style></head><body>'
    + '<title>Krish Sinha</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'
    + (fonts ? fonts.outerHTML : "") + '\n'
    + '<style id="pf-style">' + document.getElementById("pf-style").textContent + '</style>\n'
    + '<script type="application/json" id="pf-state">' + json + '<\/script>\n'
    + '<div id="app"></div>\n'
    + '<script id="pf-main">' + document.getElementById("pf-main").textContent + '<\/script>\n'
    + '</body></html>';
}

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  setStatus("Saving…");
  saveTimer = setTimeout(async function run(){
    if(!artifactNs){ setStatus("Saving isn't available in this view."); return; }
    const a = document.activeElement;
    if(a && a.dataset && a.dataset.k){ saveTimer = setTimeout(run, 800); return; }
    try{
      try{ sessionStorage.setItem("pf-editing","1"); sessionStorage.setItem("pf-scroll", String(scrollY)) }catch(e){}
      await artifactNs.publish(buildDocument());
      setStatus("Saved.");
    }catch(e){
      const c = e && e.code;
      if(c === "conflict") setStatus("Someone else saved first. Reloading their version.");
      else if(c === "not_writer" || c === "not_granted"){ canEdit = false; editing = false; render(); }
      else if(c === "rate_limited") setStatus("Saving too often. Try again in a moment.");
      else setStatus("Couldn't save. Try again.");
    }
  }, 1200);
}

async function uploadFile(file){ if(!assets) throw {code:"not_granted"}; return (await assets.upload(file)).id; }
function pick(id){
  return new Promise(res => { const el = document.getElementById(id); el.value = ""; el.onchange = () => res(Array.from(el.files || [])); el.click(); });
}
async function withUpload(fn){
  if(busy) return; busy = true;
  try{ await fn() }
  catch(e){ setStatus(e && e.code === "not_granted" ? "You don't have permission to upload here." : "Upload failed. Use an image under 20 MB."); }
  finally{ busy = false }
}

app.addEventListener("click", async ev => {
  if(editing && ev.target.closest("a")) ev.preventDefault();
  const jump = ev.target.closest('a[href^="#"]');
  if(jump && !editing){ ev.preventDefault(); const id = jump.getAttribute("href").slice(1); const el = id === "top" ? null : document.getElementById(id);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"}); else scrollTo({top:0, behavior:"smooth"}); return; }
  const b = ev.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act;
  if(act === "copy"){
    try{ await navigator.clipboard.writeText(CV.email); b.textContent = "Email copied ✓"; setTimeout(()=>{ b.textContent = CV.email }, 1600) }
    catch(e){ const r = document.createRange(); r.selectNodeContents(b); const s = getSelection(); s.removeAllRanges(); s.addRange(r) }
  } else if(act === "toggle"){
    editing = !editing; statusMsg = ""; try{ sessionStorage.setItem("pf-editing", editing?"1":"0") }catch(e){} render();
  } else if(act === "photo"){
    const [f] = await pick("file-one"); if(!f) return;
    withUpload(async () => { setStatus("Uploading…"); state.photo = await uploadFile(f); render(); save(); });
  } else if(act === "lm"){
    const key = b.dataset.key; const [f] = await pick("file-one"); if(!f) return;
    withUpload(async () => { setStatus("Uploading…"); state.landmarks[key] = await uploadFile(f); render(); save(); });
  } else if(act === "logo"){
    const key = b.dataset.key; const [f] = await pick("file-one"); if(!f) return;
    withUpload(async () => { setStatus("Uploading…"); state.logos[key] = await uploadFile(f); render(); save(); });
  } else if(act === "add"){
    const files = await pick("file-many"); if(!files.length) return;
    withUpload(async () => {
      for(let i=0;i<files.length;i++){ setStatus(`Uploading ${i+1} of ${files.length}…`); state.gallery.push({id: await uploadFile(files[i]), caption:""}); }
      render(); save();
    });
  } else if(act === "del"){
    state.gallery.splice(+b.dataset.i, 1); render(); save();
  }
});
app.addEventListener("change", ev => {
  const i = ev.target.dataset && ev.target.dataset.cap; if(i === undefined) return;
  state.gallery[+i].caption = ev.target.value.trim().slice(0,140); save();
});

try{ if("scrollRestoration" in history) history.scrollRestoration = "manual"; }catch(e){}
function clearHash(){ if(!location.hash) return; try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){ try{ location.hash = ""; }catch(e2){} } }
clearHash();
render();
let restoring = false; try{ restoring = sessionStorage.getItem("pf-scroll") !== null; }catch(e){}
if(!restoring) scrollTo(0, 0);

(async () => {
  if(!window.claude || !window.claude.use) return;
  try{
    const [u, a, art] = await Promise.all([claude.use("user"), claude.use("assets"), claude.use("artifact")]);
    assets = a; artifactNs = art;
    canEdit = !!(u && await u.canEdit()) && !!a && !!art;
    if(canEdit){ try{ editing = sessionStorage.getItem("pf-editing") === "1" }catch(e){} render();
      try{ const y = sessionStorage.getItem("pf-scroll"); if(y !== null){ sessionStorage.removeItem("pf-scroll"); scrollTo(0, +y); } }catch(e){} }
  }catch(e){}
})();
})();
</script>
</body></html>
